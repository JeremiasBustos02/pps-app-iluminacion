services:
  db:
    image: postgis/postgis:16-3.4
    container_name: alumbrado-db
    environment:
      POSTGRES_DB: alumbrado_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - alumbrado_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alumbrado_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alumbrado_pgdata:
